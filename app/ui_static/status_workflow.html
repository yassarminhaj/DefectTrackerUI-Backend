<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Workflow | Defect Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/dt-icon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/dt-icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/dt-icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/dt-icon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dt-icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="status-workflow-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">DT</span><span>Defect Tracker</span></div>
      <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Collapse sidebar" aria-expanded="true"><span data-sidebar-toggle-icon><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></span></button>
      <nav class="nav">
        <a data-nav href="dashboard.html"><span class="nav-icon">&#9633;</span>Dashboard</a>
        <a data-nav href="defect_list.html"><span class="nav-icon">&#8801;</span>Defects</a>
        <a data-nav href="projects.html"><span class="nav-icon">&#9636;</span>Projects</a>
        <a data-nav href="users.html"><span class="nav-icon">&#9678;</span>Users</a>
        <a data-nav href="environments.html"><span class="nav-icon">&#9673;</span>Environments</a>
        <a data-nav href="status_workflow.html"><span class="nav-icon">&#8596;</span>Status Workflow</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1>Status Workflow</h1>
      </header>
      <section class="content">
        <section class="card workflow-editor-card" data-workflow-editor>
          <div class="card-header workflow-editor-header">
            <div>
              <h2>Workflow Editor</h2>
              <p class="management-subtitle">Process nodes define defect statuses and arrows define allowed transitions.</p>
            </div>
            <div class="workflow-toolbar" aria-label="Workflow controls">
              <button type="button" data-workflow-add-process>Add Process</button>
              <button class="button-primary" type="button" data-workflow-save>Save Workflow</button>
              <button type="button" data-workflow-clear>Reset / Clear Canvas</button>
              <button type="button" data-workflow-delete>Delete Selected</button>
            </div>
          </div>

          <div class="workflow-canvas-shell">
            <div class="workflow-canvas" data-workflow-canvas tabindex="0" aria-label="Status workflow canvas">
              <div class="workflow-zoom-controls" aria-label="Canvas zoom controls">
                <span class="workflow-pan-mode-hint" data-workflow-pan-hint>Pan mode</span>
                <button type="button" data-workflow-zoom-in aria-label="Zoom in"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                <button type="button" data-workflow-zoom-out aria-label="Zoom out"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
              </div>
              <div class="workflow-selection-box" data-workflow-selection-box></div>
              <svg class="workflow-edge-layer" data-workflow-edges aria-hidden="true">
                <defs>
                  <marker id="workflowArrow" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                    <path class="workflow-arrow-head" d="M0,0 L12,6 L0,12 z"></path>
                  </marker>
                </defs>
              </svg>
              <div class="workflow-node-layer" data-workflow-nodes></div>
            </div>
          </div>

          <div class="workflow-footer">
            <p class="workflow-message" data-workflow-message>Saved workflows restore automatically</p>
            <div class="workflow-derived" data-workflow-derived></div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
